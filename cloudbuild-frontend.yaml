steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker pull "${_CACHE_IMAGE}" || true
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - ${_CACHE_IMAGE}
      - --file
      - Dockerfile.frontend
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
timeout: 1200s
